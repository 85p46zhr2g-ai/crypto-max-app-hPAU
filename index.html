<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Rich Bums</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- TON Connect SDK -->
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #1a150e; color: #fff; text-align: center; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
    
    /* Top Header */
    .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: rgba(0,0,0,0.3); }
    .btn-ton { background: #0088cc; color: white; border: none; padding: 8px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    
    /* Main Character Area */
    .game-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
    .bum-avatar { width: 180px; height: auto; margin-bottom: 20px; }
    .btn-feed { background: #f39c12; color: #fff; font-size: 18px; font-weight: bold; padding: 12px 40px; border: none; border-radius: 12px; width: 80%; max-width: 300px; cursor: pointer; box-shadow: 0 4px #d35400; }
    .btn-feed:active { transform: translateY(2px); box-shadow: 0 2px #d35400; }

    /* Bottom Navigation */
    .navbar { display: flex; justify-content: space-around; background: #110d08; padding: 12px 0; border-top: 1px solid #332717; }
    .nav-item { color: #888; font-size: 12px; text-decoration: none; display: flex; flex-direction: column; align-items: center; }
    .nav-item.active { color: #f39c12; }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="header">
    <button class="btn-ton">FAQ</button>
    <div id="ton-connect"></div>
  </div>

  <!-- Game Main View -->
  <div class="game-area">
    <img src="https://cdn-icons-png.flaticon.com/512/4825/4825038.png" class="bum-avatar" alt="Bum Character">
    <button class="btn-feed" onclick="feedBum()">Feed me</button>
  </div>

  <!-- Navigation Bar -->
  <div class="navbar">
    <div class="nav-item active">🏠 Home</div>
    <div class="nav-item">👥 Friends</div>
    <div class="nav-item">🤖 Trading</div>
    <div class="nav-item">📋 Tasks</div>
    <div class="nav-item">👛 Balance</div>
  </div>

  <script>
    // Init Telegram WebApp
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Init TON Connect Wallet
    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
        manifestUrl: 'https://raw.githubusercontent.com/' + location.pathname.split('/')[1] + '/' + location.pathname.split('/')[2] + '/main/tonconnect-manifest.json',
        buttonRootId: 'ton-connect'
    });

    function feedBum() {
      tg.HapticFeedback.impactOccurred('medium');
      alert('تم إطعام المشرد! +10 TRASH');
    }
  </script>
</body>
</html>
