<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRAM MAX</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #f59e0b;
            --green-btn: #16a34a;
            --border-color: #334155;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            padding-bottom: 80px;
            direction: rtl;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .user-badge {
            background: var(--card-bg);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border-color);
        }

        .lang-select {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
        }

        .app-title {
            text-align: center;
            color: var(--accent-color);
            font-size: 24px;
            font-weight: bold;
            margin: 10px 0 20px 0;
        }

        .balance-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        .balance-title {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .balance-amount {
            color: var(--accent-color);
            font-size: 28px;
            font-weight: bold;
        }

        .btn-connect {
            width: 100%;
            background: var(--green-btn);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        .section-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        .section-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .wallet-address {
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 11px;
            color: var(--accent-color);
            word-break: break-all;
            text-align: center;
            border: 1px dashed var(--border-color);
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-field {
            width: 100%;
            background: #0f172a;
            border: 1px solid var(--border-color);
            color: white;
            padding: 12px;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            text-align: center;
        }

        .btn-action {
            width: 100%;
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }

        .btn-withdraw {
            background: #e11d48;
            color: white;
        }

        .note-text {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 10px;
            text-align: center;
        }

        .nav-bar {
            position: fixed;
            bottom: 0;
            right: 0;
            left: 0;
            background: var(--card-bg);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid var(--border-color);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            color: #94a3b8;
            text-decoration: none;
        }

        .nav-item.active {
            color: var(--accent-color);
        }

        .nav-icon {
            font-size: 18px;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="header">
        <select class="lang-select">
            <option>العربية 🇸🇦</option>
            <option>English 🇺🇸</option>
        </select>
        <div class="user-badge">
            <span id="user-id">FastHelp</span>
        </div>
    </div>

    <div class="app-title">GRAM MAX</div>

    <div class="balance-card">
        <div class="balance-title">الرصيد المتاح</div>
        <div class="balance-amount">GRAM 0.90</div>
    </div>

    <button class="btn-connect" id="ton-connect-btn">
        🔗 ربط المحفظة الإلكترونية
    </button>

    <div class="section-card">
        <div class="section-title">💳 المحفظة المربوطة</div>
        <div class="wallet-address" id="wallet-address">
            لم يتم ربط محفظة بعد
        </div>
    </div>

    <!-- قسم الإيداع والشحن -->
    <div class="section-card">
        <div class="section-title">⚡ الإيداع والشحن</div>
        <div class="input-group">
            <input type="text" class="input-field" value="-op8FGLs-BxnZgOBv0CveJ8VJbC3Xc9pVXZ5X" readonly>
        </div>
        <div class="input-group">
            <input type="number" class="input-field" placeholder="الكمية المراد شحنها (GRAM)">
        </div>
        <button class="btn-action">تأكيد الإيداع</button>
    </div>

    <!-- قسم سحب الرصيد -->
    <div class="section-card">
        <div class="section-title">📤 سحب الرصيد</div>
        <div class="note-text">⚠️ الحد الأدنى للسحب: 1 GRAM (رسوم السحب 1%)</div>
        <div class="input-group">
            <input type="text" class="input-field" id="withdraw-address" placeholder="عنوان محفظة الاستلام">
        </div>
        <div class="input-group">
            <input type="number" class="input-field" id="withdraw-amount" placeholder="الكمية المراد سحبها (GRAM)" step="any">
        </div>
        <button class="btn-action btn-withdraw" onclick="handleWithdraw()">تأكيد السحب</button>
    </div>

    <nav class="nav-bar">
        <a href="#" class="nav-item">
            <span class="nav-icon">💰</span>
            <span>الاستثمار</span>
        </a>
        <a href="#" class="nav-item">
            <span class="nav-icon">📊</span>
            <span>التداول</span>
        </a>
        <a href="#" class="nav-item">
            <span class="nav-icon">👥</span>
            <span>الأصدقاء</span>
        </a>
        <a href="#" class="nav-item active">
            <span class="nav-icon">👛</span>
            <span>المحفظة</span>
        </a>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // تهيئة TON Connect
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://85p46zhr2g-ai.github.io/crypto-max-app/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-btn'
        });

        tonConnectUI.onStatusChange(wallet => {
            if (wallet) {
                document.getElementById('wallet-address').innerText = wallet.account.address;
            } else {
                document.getElementById('wallet-address').innerText = 'لم يتم ربط محفظة بعد';
            }
        });

        function handleWithdraw() {
            const address = document.getElementById('withdraw-address').value.trim();
            const amountInput = document.getElementById('withdraw-amount').value;
            const amount = parseFloat(amountInput);

            if (!address) {
                tg.showAlert('⚠️ يرجى إدخال عنوان المحفظة المراد السحب إليها.');
                return;
            }

            if (isNaN(amount) || amount < 1) {
                tg.showAlert('⚠️ عذراً، الحد الأدنى للسحب هو 1 GRAM.');
                return;
            }

            // حساب ضريبة السحب (1%) والمبلغ الصافي
            const fee = amount * 0.01;
            const netAmount = amount - fee;

            tg.showAlert(`✅ تم تقديم طلب السحب بنجاح!\n\nالمبلغ المطلوب: ${amount} GRAM\nالرسوم (1%): ${fee.toFixed(4)} GRAM\nالمبلغ الصافي للوصول: ${netAmount.toFixed(4)} GRAM`);
        }
    </script>
</body>
</html>
