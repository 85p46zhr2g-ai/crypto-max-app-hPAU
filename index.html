<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRAM MAX</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="header">
    <h2>GRAM MAX</h2>
    <div class="balance-card">
      <span>الرصيد المتاح</span>
      <h1 id="user-balance">0.00 GRAM</h1>
    </div>
  </div>

  <!-- التبويبات السفلى -->
  <div class="content">
    <!-- قسم الاستثمار -->
    <div id="tab-invest" class="tab-content active">
      <h3>💎 مستويات الاستثمار</h3>
      <div id="investment-levels"></div>
    </div>

    <!-- قسم الأصدقاء والإحالة -->
    <div id="tab-friends" class="tab-content">
      <h3>👥 برنامج الإحالات</h3>
      <p>شارك الرابط مع أصدقائك واحصل على مكافآت:</p>
      <div class="referral-box">
        <input type="text" id="ref-link" readonly value="جاري التحميل...">
        <button onclick="copyRefLink()">نسخ الرابط</button>
      </div>
      <div class="stats">
        <p>عدد الإحالات: <b id="ref-count">0</b></p>
      </div>
    </div>

    <!-- قسم المحفظة والشحن -->
    <div id="tab-wallet" class="tab-content">
      <h3>💳 شحن الرصيد والآيداع</h3>
      <input type="number" id="deposit-amount" placeholder="أدخل كمية GRAM">
      <button onclick="handleDeposit()">شحن الرصيد ⚡</button>

      <hr>

      <h3>📤 طلب سحب الأرباح</h3>
      <input type="text" id="withdraw-address" placeholder="عنوان المحفظة">
      <input type="number" id="withdraw-amount" placeholder="مبلغ السحب بـ GRAM">
      <button onclick="handleWithdraw()">إرسال طلب السحب 📨</button>
    </div>
  </div>

  <!-- شريط التنقل -->
  <div class="nav-bar">
    <button onclick="switchTab('invest')" class="nav-btn active">💰 الاستثمار</button>
    <button onclick="switchTab('friends')" class="nav-btn">👥 الأصدقاء</button>
    <button onclick="switchTab('wallet')" class="nav-btn">👛 المحفظة</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
