<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRAM MAX</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #151c24;
      --primary-yellow: #f59e0b;
      --primary-yellow-hover: #d97706;
      --text-main: #ffffff;
      --text-sub: #9ca3af;
      --border-color: #1f2937;
      --green-accent: #10b981;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 12px;
      padding-bottom: 75px;
      direction: rtl;
    }

    .header {
      text-align: center;
      margin-bottom: 15px;
    }

    .header h2 {
      margin: 0 0 10px 0;
      color: var(--primary-yellow);
      font-size: 20px;
    }

    .balance-card {
      background: var(--card-bg);
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      text-align: center;
    }

    .balance-card span {
      font-size: 12px;
      color: var(--text-sub);
    }

    .balance-card h1 {
      color: var(--primary-yellow);
      margin: 4px 0 0 0;
      font-size: 26px;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid var(--border-color);
    }

    .card.locked {
      opacity: 0.6;
    }

    .card h4 { 
      margin: 0 0 6px 0; 
      color: var(--primary-yellow); 
      font-size: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card p { margin: 3px 0; font-size: 12px; color: var(--text-sub); }
    .profit { color: var(--green-accent); font-weight: bold; }

    input {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: #0b0e14;
      color: #fff;
      box-sizing: border-box;
      font-size: 13px;
    }

    .admin-wallet-box {
      background: #0b0e14;
      border: 1px dashed var(--primary-yellow);
      padding: 8px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 11px;
      word-break: break-all;
      text-align: center;
      color: var(--primary-yellow);
      margin: 6px 0;
    }

    button {
      width: 100%;
      padding: 10px;
      background: var(--primary-yellow);
      color: #000;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      margin-top: 4px;
    }

    button.disabled-btn {
      background: #374151;
      color: #9ca3af;
      cursor: not-allowed;
    }

    .nav-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--card-bg);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      border-top: 1px solid var(--border-color);
    }

    .nav-btn {
      background: none; border: none;
      color: var(--text-sub); font-size: 12px;
      display: flex; flex-direction: column; align-items: center;
      gap: 2px;
    }

    .nav-btn.active { color: var(--primary-yellow); font-weight: bold; }
    hr { border: none; border-top: 1px solid var(--border-color); margin: 15px 0; }
  </style>
</head>
<body>

  <div class="header">
    <h2>GRAM MAX</h2>
    <div class="balance-card">
      <span>الرصيد المتاح</span>
      <h1 id="user-balance">0.00 GRAM</h1>
    </div>
  </div>

  <div class="content">
    <!-- 1. قسم الاستثمار -->
    <div id="tab-invest" class="tab-content active">
      <div id="investment-levels"></div>
    </div>

    <!-- 2. قسم الإحالات -->
    <div id="tab-friends" class="tab-content">
      <div class="card">
        <h4 style="color: var(--primary-yellow);">👥 دعوة الأصدقاء</h4>
        <input type="text" id="ref-link" readonly value="جاري التحميل...">
        <button onclick="copyRefLink()">📋 مشاركة الرابط</button>
      </div>
      <div class="card">
        <p>عدد الإحالات: <b id="ref-count" style="color: var(--primary-yellow);">0</b></p>
      </div>
    </div>

    <!-- 3. قسم المحفظة -->
    <div id="tab-wallet" class="tab-content">
      <div class="card">
        <h4>⚡ الإيداع الشحن</h4>
        <p>حَوّل المبلغ إلى محفظة الأدمن وسينزل لك في الرصيد الوهمي:</p>
        <div class="admin-wallet-box" id="admin-wallet-address">
          UQBr...XZ5X
        </div>
        <input type="number" id="deposit-amount" placeholder="الكمية بـ GRAM" min="1">
        <button onclick="handleDeposit()">⚡ شحن الرصيد</button>
      </div>

      <hr>

      <div class="card">
        <h4>📫 طلب سحب الأرباح</h4>
        <input type="text" id="withdraw-address" placeholder="عنوان المحفظة">
        <input type="number" id="withdraw-amount" placeholder="مبلغ السحب بـ GRAM" min="1">
        <button onclick="handleWithdraw()">📨 إرسال طلب السحب</button>
      </div>
    </div>
  </div>

  <!-- الشريط السفلي -->
  <div class="nav-bar">
    <button onclick="switchTab('invest', this)" class="nav-btn active"><span>💰</span><span>الاستثمار</span></button>
    <button onclick="switchTab('friends', this)" class="nav-btn"><span>👥</span><span>الأصدقاء</span></button>
    <button onclick="switchTab('wallet', this)" class="nav-btn"><span>👛</span><span>المحفظة</span></button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const BOT_USERNAME = "GramMax3_Bot";
    const ADMIN_WALLET = "UQBr_XZ5X_YOUR_ADMIN_WALLET"; 

    let userData = {
      balance: 0.00,
      refCount: 0,
      currentUnlockedLevel: 1, // المستوى المفتوح حالياً
      userId: tg.initDataUnsafe?.user?.id || '12345678'
    };

    const levels = [
      { id: 1, name: "المستوى 1", cost: 1, return: 1.15, profit: "0.15+", duration: "12 ساعة" },
      { id: 2, name: "المستوى 2", cost: 2, return: 2.30, profit: "0.30+", duration: "24 ساعة" },
      { id: 3, name: "المستوى 3", cost: 5, return: 5.70, profit: "0.70+", duration: "48 ساعة" },
      { id: 4, name: "المستوى 4", cost: 7, return: 8.30, profit: "1.30+", duration: "72 ساعة" },
      { id: 5, name: "المستوى 5", cost: 10, return: 13.00, profit: "3.00+", duration: "120 ساعة" }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('admin-wallet-address').innerText = ADMIN_WALLET;
      document.getElementById('ref-link').value = `https://t.me/${BOT_USERNAME}?start=ref_${userData.userId}`;
      updateUI();
      renderLevels();
    });

    function updateUI() {
      document.getElementById('user-balance').innerText = `${userData.balance.toFixed(2)} GRAM`;
      document.getElementById('ref-count').innerText = userData.refCount;
    }

    // عرض المستويات مع إغلاق المستويات المتقدمة
    function renderLevels() {
      const container = document.getElementById('investment-levels');
      container.innerHTML = '';

      levels.forEach(lvl => {
        const isUnlocked = lvl.id <= userData.currentUnlockedLevel;
        const card = document.createElement('div');
        card.className = `card ${isUnlocked ? '' : 'locked'}`;
        
        let buttonHTML = isUnlocked 
          ? `<button onclick="startInvestment(${lvl.id}, ${lvl.cost}, ${parseFloat(lvl.profit)})">استثمار (${lvl.cost} GRAM)</button>`
          : `<button class="disabled-btn" disabled>🔒 مقفل حتى إكمال المستوى السابق</button>`;

        card.innerHTML = `
          <h4>
            <span>🔹 ${lvl.name}</span>
            <span style="font-size: 11px; color: ${isUnlocked ? '#10b981' : '#ef4444'};">${isUnlocked ? '🟢 مفتوح' : '🔒 مقفل'}</span>
          </h4>
          <p>الاستثمار: <b>GRAM ${lvl.cost}</b></p>
          <p>العائد: <b>GRAM ${lvl.return}</b></p>
          <p>الربح: <span class="profit">GRAM ${lvl.profit}</span></p>
          <p>المدة: <b>${lvl.duration}</b></p>
          ${buttonHTML}
        `;
        container.appendChild(card);
      });
    }

    function startInvestment(levelId, cost, profit) {
      if (userData.balance < cost) {
        tg.showAlert("⚠️ رصيدك المتاح غير كافٍ!");
        return;
      }

      userData.balance -= cost;
      updateUI();

      tg.showAlert(`✅ تم بدء ${levels[levelId - 1].name}!\nعند اكتمال المدة، سيتم إضافة الأرباح لرصيدك الداخلي ويفتح المستوى التالي.`);
      
      // فتح المستوى التالي
      if (levelId === userData.currentUnlockedLevel && levelId < levels.length) {
        userData.currentUnlockedLevel = levelId + 1;
        renderLevels();
      }
    }

    function handleDeposit() {
      const amount = parseFloat(document.getElementById('deposit-amount').value);
      if (!amount || amount <= 0) {
        tg.showAlert("أدخل مبلغ صحيح.");
        return;
      }
      tg.showAlert(`📥 تم إرسال طلب الشحن بقيمة ${amount} GRAM للمشرف.`);
    }

    function handleWithdraw() {
      const address = document.getElementById('withdraw-address').value.trim();
      const amount = parseFloat(document.getElementById('withdraw-amount').value);

      if (!address || !amount || amount <= 0) {
        tg.showAlert("أدخل المحفظة والمبلغ بشكل صحيح.");
        return;
      }
      if (amount > userData.balance) {
        tg.showAlert("❌ رصيدك الداخلي الحالي لا يكفي لهذا السحب.");
        return;
      }

      userData.balance -= amount;
      updateUI();
      const serialNum = "SN-" + Math.floor(100000 + Math.random() * 900000);
      tg.showAlert(`📤 تم طلب السحب!\nالرقم التسلسلي: ${serialNum}\nخصم ${amount} GRAM من رصيدك، والطلب قيد المراجعة عند الأدمن.`);
    }

    function copyRefLink() {
      navigator.clipboard.writeText(document.getElementById('ref-link').value);
      tg.showAlert("📋 تم نسخ رابط الإحالة!");
    }

    function switchTab(tabName, btnElement) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(`tab-${tabName}`).classList.add('active');
      btnElement.classList.add('active');
    }
  </script>
</body>
</html>
