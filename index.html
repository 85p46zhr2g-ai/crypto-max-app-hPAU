<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GRAM MAX Mini App</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --success-color: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: 100vh;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 22px;
            color: var(--accent-color);
            margin-bottom: 4px;
        }

        .header p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .user-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px;
        }

        .balance-box {
            text-align: center;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 12px;
            padding: 16px;
            margin: 12px 0;
        }

        .balance-title {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .balance-value {
            font-size: 28px;
            font-weight: bold;
            color: var(--accent-color);
        }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .section-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .support-box {
            text-align: center;
            padding: 12px;
        }

        .support-box a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            margin-top: auto;
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
            padding: 12px 0;
        }
    </style>
</head>
<body>

    <!-- الهيدر والمعلومات الأساسية -->
    <div class="card">
        <div class="header">
            <h1>GRAM MAX</h1>
            <p>التطبيق المصغر لمنصة الاستثمار والخدمات</p>
        </div>

        <div class="user-info" id="userInfo">
            <span id="userName">مرحباً...</span>
            <span id="userId" style="font-size: 11px; color: var(--text-secondary);">ID: -</span>
        </div>

        <div class="balance-box">
            <div class="balance-title">رصيدك الحالي</div>
            <div class="balance-value"><span id="userBalance">0.00</span> <small style="font-size: 14px;">GRAM</small></div>
        </div>
    </div>

    <!-- شبكة التصفح الرئيسية -->
    <div class="nav-grid">
        <button class="btn" onclick="openInvest()">
            📈 الاستثمار
        </button>
        <button class="btn btn-outline" onclick="openWithdraw()">
            💸 السحب
        </button>
        <button class="btn btn-outline" onclick="openTasks()">
            📋 المهام
        </button>
        <button class="btn btn-outline" onclick="openReferrals()">
            👥 الإحالات
        </button>
    </div>

    <!-- قسم الدعم والإعدادات -->
    <div class="card">
        <div class="section-title">⚙️ الدعم والتواصل</div>
        <div class="support-box">
            <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 8px;">لأي استفسارات أو مواجهة مشاكل يرجى التواصل معنا:</p>
            <a href="https://t.me/FastHelp3" target="_blank" class="btn btn-outline">
                💬 التواصل مع الدعم الفني (@FastHelp3)
            </a>
        </div>
    </div>

    <footer>
        GRAM MAX Mini App &copy; 2026
    </footer>

    <script>
        // تهيئة Telegram WebApp SDK
        const tg = window.Telegram.WebApp;
        tg.expand(); // توسيع الشاشة بالكامل

        // جلب بيانات المستخدم من تلجرام
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('userName').innerText = `مرحباً، ${user.first_name}`;
            document.getElementById('userId').innerText = `ID: ${user.id}`;
        }

        // الوظائف البرمجية للأزرار
        function openInvest() {
            tg.sendData(JSON.stringify({ action: 'invest' }));
            tg.showAlert('قسم الاستثمار: يمكنك متابعة الخطط الاستثمارية المتاحة عبر البوت.');
        }

        function openWithdraw() {
            tg.showAlert('قسم السحب: تأكد من ربط محفظة TON الخاصة بك في البوت أولاً.');
        }

        function openTasks() {
            tg.showAlert('قسم المهام: لا توجد مهام متاحة حالياً، يرجى المتابعة لاحقاً.');
        }

        function openReferrals() {
            tg.showAlert('قسم الإحالات: يمكنك نسخ رابط الإحالة الخاص بك مباشرة من محادثة البوت.');
        }
    </script>
</body>
</html>
