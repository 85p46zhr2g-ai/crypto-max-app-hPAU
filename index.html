<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRAM MAX</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #0284c7;
      --accent-hover: #0369a1;
      --text-main: #ffffff;
      --text-sub: #94a3b8;
      --border-color: #334155;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
      padding: 15px;
      padding-bottom: 80px;
      direction: rtl;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h2 {
      margin: 0 0 10px 0;
      letter-spacing: 1px;
      color: #38bdf8;
    }

    .balance-card {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      padding: 15px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .balance-card span {
      font-size: 13px;
      color: var(--text-sub);
    }

    .balance-card h1 {
      color: #38bdf8;
      margin: 5px 0 0 0;
      font-size: 28px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 12px;
      border: 1px solid var(--border-color);
    }

    .card h4 {
      margin: 0 0 8px 0;
      color: #38bdf8;
      font-size: 16px;
    }

    .card p {
      margin: 4px 0;
      font-size: 13px;
      color: var(--text-sub);
    }

    .card .profit {
      color: #22c55e;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: #0f172a;
      color: #fff;
      box-sizing: border-box;
      font-size: 14px;
    }

    input:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    button {
      width: 100%;
      padding: 12px;
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      margin-top: 5px;
      transition: background 0.2s;
    }

    button:hover {
      background: var(--accent-hover);
    }

    .stats-box {
      background: var(--card-bg);
      padding: 15px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      margin-top: 15px;
    }

    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #0f172a;
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
      border-top: 1px solid var(--border-color);
      z-index: 100;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 13px;
      width: auto;
      margin: 0;
      padding: 5px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .nav-btn.active {
      color: #38bdf8;
      font-weight: bold;
    }

    hr {
      border: none;
      border-top: 1px solid var(--border-color);
      margin: 20px 0;
    }
  </style>
</head>
<body>

  <!-- الرأس وعرض الرصيد -->
  <div class="header">
    <h2>GRAM MAX</h2>
    <div class="balance-card">
      <span>الرصيد المتاح</span>
      <h1 id="user-balance">0.00 GRAM</h1>
    </div>
  </div>

  <div class="content">
    <!-- 1. قسم الاستثمار -->
    <div id="tab-invest" class="tab-content active">
      <h3 style="font-size: 16px; margin-bottom: 12px;">💎 مستويات الاستثمار</h3>
      <div id="investment-levels"></div>
    </div>

    <!-- 2. قسم الأصدقاء والإحالات -->
    <div id="tab-friends" class="tab-content">
      <h3 style="font-size: 16px;">👥 برنامج الإحالات</h3>
      <p style="font-size: 13px; color: var(--text-sub);">شارك الرابط الخاص بك مع أصدقائك للربح:</p>
      
      <div class="card">
        <input type="text" id="ref-link" readonly value="جاري تحميل الرابط...">
        <button onclick="copyRefLink()">📋 نسخ رابط الإحالة</button>
      </div>

      <div class="stats-box">
        <p style="margin: 0;">عدد الإحالات الناجحة: <b id="ref-count" style="color: #38bdf8;">0</b></p>
      </div>
    </div>

    <!-- 3. قسم المحفظة والشحن والسحب -->
    <div id="tab-wallet" class="tab-content">
      <div class="card">
        <h3>⚡ إيداع وشحن الرصيد</h3>
        <p>أدخل المبلغ المطلوبة إضافته لحسابك الداخلي:</p>
        <input type="number" id="deposit-amount" placeholder="الكمية بـ GRAM" min="1">
        <button onclick="handleDeposit()">شحن الرصيد</button>
      </div>

      <hr>

      <div class="card">
        <h3>📫 طلب سحب الأرباح</h3>
        <p>سيتم خصم المبلغ المباشر من رصيدك الوهمي الداخلي وإرسال الطلب للمشرف:</p>
        <input type="text" id="withdraw-address" placeholder="عنوان المحفظة">
        <input type="number" id="withdraw-amount" placeholder="مبلغ السحب بـ GRAM" min="1">
        <button onclick="handleWithdraw()">إرسال طلب السحب 📨</button>
      </div>
    </div>
  </div>

  <!-- شريط التنقل السفلي -->
  <div class="nav-bar">
    <button onclick="switchTab('invest', this)" class="nav-btn active">
      <span>💎</span>
      <span>الاستثمار</span>
    </button>
    <button onclick="switchTab('friends', this)" class="nav-btn">
      <span>👥</span>
      <span>الأصدقاء</span>
    </button>
    <button onclick="switchTab('wallet', this)" class="nav-btn">
      <span>👛</span>
      <span>المحفظة</span>
    </button>
  </div>

  <!-- منطق التطبيق (JavaScript) -->
  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // اسم البوت الخاص بك لإنشاء رابط الإحالة
    const BOT_USERNAME = "GramMax3_Bot";

    // بيانات المستخدم في الجلسة الحالية
    let userData = {
      balance: 0.00,
      refCount: 0,
      userId: tg.initDataUnsafe?.user?.id || '12345678'
    };

    // بيانات مستويات الاستثمار الـ 5
    const levels = [
      { id: 1, name: "المستوى 1", cost: 1, return: 1.15, profit: "0.15+", duration: "12 ساعة" },
      { id: 2, name: "المستوى 2", cost: 2, return: 2.30, profit: "0.30+", duration: "24 ساعة" },
      { id: 3, name: "المستوى 3", cost: 5, return: 5.70, profit: "0.70+", duration: "48 ساعة" },
      { id: 4, name: "المستوى 4", cost: 7, return: 8.30, profit: "1.30+", duration: "72 ساعة" },
      { id: 5, name: "المستوى 5", cost: 10, return: 13.00, profit: "3.00+", duration: "120 ساعة" }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      updateUI();
      renderLevels();
      
      // إعداد رابط الإحالة الخاص بالمستخدم
      const refLink = `https://t.me/${BOT_USERNAME}?start=ref_${userData.userId}`;
      document.getElementById('ref-link').value = refLink;
    });

    // تحديث الواجهة والكرت الخاص بالرصيد
    function updateUI() {
      document.getElementById('user-balance').innerText = `${userData.balance.toFixed(2)} GRAM`;
      document.getElementById('ref-count').innerText = userData.refCount;
    }

    // عرض كروت المستويات
    function renderLevels() {
      const container = document.getElementById('investment-levels');
      container.innerHTML = '';

      levels.forEach(lvl => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <h4>🔹 ${lvl.name}</h4>
          <p>مبلغ الاستثمار: <b>${lvl.cost} GRAM</b></p>
          <p>العائد التجميعي: <b>${lvl.return} GRAM</b></p>
          <p>الربح الصافي: <span class="profit">${lvl.profit} GRAM</span></p>
          <p>المدة الزمنية: <b>${lvl.duration}</b></p>
          <button onclick="startInvestment(${lvl.cost}, ${parseFloat(lvl.profit)}, '${lvl.duration}')">استثمار (${lvl.cost} GRAM)</button>
        `;
        container.appendChild(card);
      });
    }

    // التنفيذ عند الضغط على الاستثمار
    function startInvestment(cost, profit, duration) {
      if (userData.balance < cost) {
        tg.showAlert("⚠️ رصيدك المتاح غير كافٍ لهذا المستوى!");
        return;
      }

      userData.balance -= cost;
      updateUI();
      
      tg.showAlert(`✅ تم بدء الاستثمار بنجاح!\nسيتم إضافة العائد والربح (${cost + profit} GRAM) إلى رصيدك الداخلي تلقائياً بعد انتهاء مدة (${duration}).`);
    }

    // عند طلب الشحن/الإيداع
    function handleDeposit() {
      const amountInput = document.getElementById('deposit-amount');
      const amount = parseFloat(amountInput.value);

      if (!amount || amount <= 0) {
        tg.showAlert("يرجى إدخال مبلغ إيداع صحيح.");
        return;
      }

      tg.showAlert(`📥 تم إرسال طلب شحن الرصيد بقيمة ${amount} GRAM للمشرف.\nسيتم إضافة المبلغ لرصيدك فور التأكيد.`);
      amountInput.value = '';
    }

    // عند طلب السحب
    function handleWithdraw() {
      const addressInput = document.getElementById('withdraw-address');
      const amountInput = document.getElementById('withdraw-amount');

      const address = addressInput.value.trim();
      const amount = parseFloat(amountInput.value);

      if (!address || !amount || amount <= 0) {
        tg.showAlert("يرجى إدخال عنوان المحفظة والمبلغ بشكل صحيح.");
        return;
      }

      if (amount > userData.balance) {
        tg.showAlert("❌ رصيدك الوهمي الداخلي غير كافٍ لاتمام هذا السحب!");
        return;
      }

      // خصم المبلغ من الرصيد الداخلي
      userData.balance -= amount;
      updateUI();

      // إنشاء رقم تسلسلي
      const serialNum = "SN-" + Math.floor(100000 + Math.random() * 900000);

      tg.showAlert(`📤 تم إرسال طلب السحب بنجاح!\n\nالمبلغ: ${amount} GRAM\nالرقم التسلسلي: ${serialNum}\nالمحفظة: ${address}\n\nتم خصم المبلغ من رصيدك الداخلي وفي انتظار موافقة المشرف.`);

      addressInput.value = '';
      amountInput.value = '';
    }

    // نسخ رابط الإحالة
    function copyRefLink() {
      const refInput = document.getElementById('ref-link');
      refInput.select();
      refInput.setSelectionRange(0, 99999);
      
      navigator.clipboard.writeText(refInput.value).then(() => {
        tg.showAlert("📋 تم نسخ رابط الإحالة بنجاح!");
      }).catch(() => {
        document.execCommand('copy');
        tg.showAlert("📋 تم نسخ رابط الإحالة!");
      });
    }

    // التبديل بين التبويبات
    function switchTab(tabName, btnElement) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

      document.getElementById(`tab-${tabName}`).classList.add('active');
      btnElement.classList.add('active');
    }
  </script>
</body>
</html>
